[project]
name = "bip39-5-dice-seed"
version = "0.1.0"
description = "Generate BIP39 seed words with five six-sided dice, read straight off printed tables."
requires-python = ">=3.11"
dependencies = [
    "jinja2>=3.1.6",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=8.4.2",
    "ruff>=0.13.0",
]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4"]
